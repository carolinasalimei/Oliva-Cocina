<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óliva Cocina - Menú Viandas</title>
  
  <!-- Fuentes para replicar el folleto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #eacab7;
      --olive-green: #485236;
      --text-dark: #2b2b2b;
      --card-bg: #f5dfd2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      padding-bottom: 100px;
    }

    /* HEADER IDENTICO AL LOGO */
    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem 1rem;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .sub-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--olive-green);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.2;
      width: 100px;
      text-align: center;
    }

    .logo-oliva {
      width: 55px;
      height: auto;
    }

    .main-title-container {
      margin-top: 1.5rem;
    }

    .main-title {
      font-family: 'Oswald', sans-serif;
      color: var(--olive-green);
      font-size: 2.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .main-title span {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-style: italic;
      text-transform: lowercase;
      font-size: 2.2rem;
      letter-spacing: 0;
    }

    /* CONTENEDOR Y PROMO */
    .container {
      max-width: 850px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .price-box {
      border: 1.5px solid var(--olive-green);
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255,255,255,0.15);
    }

    .price-item {
      font-family: 'Oswald', sans-serif;
      color: var(--olive-green);
      font-size: 1.4rem;
    }

    .price-item small {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      color: var(--text-dark);
      font-weight: 600;
    }

    /* GRID DE CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(72, 82, 54, 0.2);
    }

    .card-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card h3 {
      font-family: 'Oswald', sans-serif;
      color: var(--olive-green);
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }

    .card p {
      font-size: 0.8rem;
      font-style: italic;
      color: #555;
      margin-bottom: 0.8rem;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-color);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--olive-green);
    }

    .btn-qty {
      background: var(--olive-green);
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .qty { font-weight: 700; font-size: 0.9rem; }

    /* FOOTER / BARRA COMPRA */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--olive-green);
      color: white;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 850px;
      margin: 0 auto;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .btn-whatsapp {
      background-color: #ffffff;
      color: var(--olive-green);
      border: none;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-header">
      <div class="sub-title">GOURMET<br>KITCHEN</div>
      <!-- Logo Oliva Vectorial -->
      <svg class="logo-oliva" viewBox="0 0 100 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M78 4 C50 25, 45 45, 45 45" stroke="#485236" stroke-width="8" stroke-linecap="round"/>
        <path d="M50 40 C25 40, 15 75, 35 110 C55 140, 85 120, 80 80 C75 45, 60 40, 50 40 Z" fill="#485236"/>
        <ellipse cx="52" cy="78" rx="8" ry="18" fill="#eacab7" transform="rotate(-15 52 78)"/>
      </svg>
      <div class="sub-title">FOR YOUR<br>HOUSE</div>
    </div>

    <div class="main-title-container">
      <h1 class="main-title"><span>menú</span> VIANDAS</h1>
    </div>
  </header>

  <div class="container">
    <div class="price-box">
      <div class="price-item">
        <small>5 MENÚS</small>
        $11.000 <span style="font-size:0.9rem">c/u</span>
      </div>
      <div style="height:30px; border-left:1px solid var(--olive-green)"></div>
      <div class="price-item">
        <small>10 MENÚS</small>
        $10.000 <span style="font-size:0.9rem">c/u</span>
      </div>
    </div>

    <div class="grid" id="menu-grid"></div>
  </div>

  <div class="cart-bar">
    <div>
      <span style="font-size:0.85rem;">Total viandas: <strong id="total-count">0</strong></span><br>
      <span style="font-size:1.1rem; font-weight:700;">Total: <span id="total-price">$0</span></span>
    </div>
    <button class="btn-whatsapp" onclick="sendWhatsApp()">Pedir por WhatsApp</button>
  </div>

  <script>
    const menu = [
      { id: 1, name: "Bondiola desmenuzada con boniato", desc: "", img: "bondiola.jpg" },
      { id: 2, name: "Wok de carne", desc: "roast beef, cebolla, morrones, zanahoria", img: "wok.jpg" },
      { id: 3, name: "Pollo pata muslo al disco", desc: "pollo, cebolla, morrones, zanahoria, puré de tomate", img: "pollo-disco.jpg" },
      { id: 4, name: "Pastel de carne", desc: "roast beef picado, cebolla, morrones, boniato", img: "pastel-carne.jpeg" },
      { id: 5, name: "Pollo teriyaki con arroz", desc: "", img: "pollo-teriyaki.jpeg" },
      { id: 6, name: "Tarta de calabaza", desc: "", img: "tarta-calabaza.jpg" },
      { id: 7, name: "Tarta de cebolla caramelizada", desc: "", img: "https://placehold.co/400x180?text=Tarta+Cebolla" },
      { id: 8, name: "Tarta de cebolla y puerro", desc: "", img: "https://placehold.co/400x180?text=Tarta+Puerro" },
      { id: 9, name: "Tortilla de papa", desc: "", img: "https://placehold.co/400x180?text=Tortilla+Papa" }
    ];

    const cart = {};

    function renderMenu() {
      const container = document.getElementById('menu-grid');
      container.innerHTML = menu.map(item => `
        <div class="card">
          <img src="${item.img}" alt="${item.name}" class="card-img" onerror="this.onerror=null; this.src='https://placehold.co/400x180?text=Óliva+Cocina';">
          <div class="card-body">
            <div>
              <h3>${item.name}</h3>
              ${item.desc ? `<p>(${item.desc})</p>` : ''}
            </div>
            <div class="controls">
              <button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button>
              <span class="qty" id="qty-${item.id}">0</span>
              <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] < 0) cart[id] = 0;
      document.getElementById(`qty-${id}`).innerText = cart[id];
      calculateTotal();
    }

    function calculateTotal() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      let pricePerUnit = 11000;
      
      if (totalCount >= 10) {
        pricePerUnit = 10000;
      }

      const totalPrice = totalCount * pricePerUnit;

      document.getElementById('total-count').innerText = totalCount;
      document.getElementById('total-price').innerText = `$${totalPrice.toLocaleString('es-AR')}`;
    }

    function sendWhatsApp() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      if (totalCount < 5) {
        alert("El pedido mínimo es de 5 viandas.");
        return;
      }

      let message = "Hola Óliva Cocina! Quisiera hacer el siguiente pedido:\n\n";
      menu.forEach(item => {
        if (cart[item.id] > 0) {
          message += `• ${item.name} x${cart[item.id]}\n`;
        }
      });

      const pricePerUnit = totalCount >= 10 ? 10000 : 11000;
      message += `\nTotal viandas: ${totalCount}`;
      message += `\nTotal a pagar: $${(totalCount * pricePerUnit).toLocaleString('es-AR')}`;

      const phone = "5491178204603";
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    renderMenu();
  </script>
</body>
</html>
